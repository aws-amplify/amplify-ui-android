name: Run code coverage

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v2

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Run test and generate kover report
        run: ./gradlew koverXmlReportCoverage

      - name: Upload Test Report
        uses: codecov/codecov-action@v7
        with:
          name: report
          files: build/reports/kover/reportCoverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
